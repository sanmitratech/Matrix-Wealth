<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrix Insights – Prototype by CoReCo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --blue:#1897C0;--teal:#2DBAC3;--aqua:#8FD6DC;--pale:#E9F6F8;--pale2:#F5FAFB;
  --ink:#16252D;--text:#51616A;--muted:#8D9BA2;--line:#E7EDEF;--bg:#FFFFFF;--card:#FFFFFF;
  --warn:#C9832B;--warnbg:#FCF5EA;--good:#1E9D6B;--bad:#C4533F;--c4:#C7DDE5;--c5:#DDE4E7;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#3FB2D8;--teal:#46CBD3;--aqua:#2D7F8A;--pale:#143039;--pale2:#10262E;
  --ink:#EAF2F4;--text:#AABBC2;--muted:#7D9098;--line:#1F3943;--bg:#0B1C23;--card:#0B1C23;
  --warn:#E0A55A;--warnbg:#2B2416;--good:#4CC792;--bad:#E3806E;--c4:#2B4B57;--c5:#22363E;}}
:root[data-theme="dark"]{
  --blue:#3FB2D8;--teal:#46CBD3;--aqua:#2D7F8A;--pale:#143039;--pale2:#10262E;
  --ink:#EAF2F4;--text:#AABBC2;--muted:#7D9098;--line:#1F3943;--bg:#0B1C23;--card:#0B1C23;
  --warn:#E0A55A;--warnbg:#2B2416;--good:#4CC792;--bad:#E3806E;--c4:#2B4B57;--c5:#22363E;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*:before,*:after{box-sizing:inherit;margin:0;padding:0}
body{letter-spacing:-.003em;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 32px}
@media (max-width:640px){.wrap{padding:0 20px}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:68px}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-weight:600;letter-spacing:-.02em;font-size:19px;color:var(--ink)}
.brand span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.brand img{height:19px;transform:translateY(4px)}
nav{display:flex;gap:4px;margin-left:auto}
nav a{font-size:13.5px;padding:8px 14px;border-radius:20px;color:var(--text);position:relative;white-space:nowrap}
nav a.on{color:var(--blue);background:var(--pale)}
nav a .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.theme{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:15px;color:var(--muted)}
.theme:hover{background:var(--pale)}
@media (max-width:760px){
  .top .wrap{flex-wrap:wrap;height:auto;padding-top:12px;padding-bottom:6px;row-gap:6px}
  .brand{flex:1}
  nav{order:3;width:100%;margin-left:-14px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
}

main{min-height:calc(100vh - 140px)}
.page{padding:56px 0 96px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}}
@media (max-width:640px){.page{padding:36px 0 72px}}

.crumb{font-size:12.5px;color:var(--muted);margin-bottom:18px;display:flex;gap:8px;flex-wrap:wrap}
.crumb a{color:var(--blue)}
h1{font-weight:600;letter-spacing:-.025em;color:var(--ink);font-size:38px;line-height:1.12}
h2{font-weight:600;letter-spacing:-.02em;color:var(--ink);font-size:22px;line-height:1.3}
h3{font-size:15px;font-weight:500;color:var(--ink)}
@media (max-width:640px){h1{font-size:28px}}
.intro{font-size:16px;color:var(--text);max-width:560px;margin-top:10px;font-weight:400;letter-spacing:-.005em}
.meta{font-size:12.5px;color:var(--muted)}
.section{margin-top:64px}
@media (max-width:640px){.section{margin-top:48px}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}

/* KPI row */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:48px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:26px 24px 26px 0;display:block;text-align:left;background:none;border:0}
.kpi+.kpi{padding-left:24px;border-left:1px solid var(--line)}
a.kpi:hover .kv{color:var(--blue)}
.kl{font-size:12.5px;color:var(--muted)}
.kv{font-weight:500;letter-spacing:-.02em;font-size:30px;color:var(--ink);line-height:1.2;margin-top:6px;transition:color .2s;white-space:nowrap}
.kd{font-size:12px;margin-top:6px}
.up{color:var(--good)}.down{color:var(--bad)}
.pend{font-size:11.5px;color:var(--warn);margin-top:6px}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){padding-left:0;border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}.kv{font-size:24px}}

/* status line */
.status{display:flex;align-items:center;gap:14px;margin-top:28px;padding:16px 20px;border-radius:14px;background:var(--pale2);font-size:13.5px;color:var(--ink);flex-wrap:wrap}
.status .d{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.status.ok .d{background:var(--good)}
.status a{margin-left:auto;color:var(--blue);font-weight:500;font-size:13px}
@media (max-width:640px){.status .d{display:none}.status a{margin-left:0}}

/* chart */
.chart{position:relative;height:280px}
.chart.sm{height:220px}
.seg{display:inline-flex;background:var(--pale2);border-radius:20px;padding:3px}
.seg button{border:0;background:transparent;font-size:12px;padding:5px 12px;border-radius:16px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* explore list */
.list{border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:1fr auto 20px;gap:20px;align-items:center;padding:22px 4px;border-bottom:1px solid var(--line);transition:background .2s}
.li:hover{background:var(--pale2)}
.li .t{font-size:15px;color:var(--ink);font-weight:500}
.li .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.li .v{font-weight:500;letter-spacing:-.02em;font-size:19px;color:var(--ink);text-align:right;white-space:nowrap}
.li .v small{display:block;font-size:11.5px;color:var(--muted)}
.li .chev{color:var(--muted);font-size:18px}
@media (max-width:560px){.li{grid-template-columns:1fr 16px;gap:12px}.li .v{display:none}}

/* bars */
.bars .row{display:grid;grid-template-columns:200px 1fr 130px;gap:18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.bars a.row:hover .n{color:var(--blue)}
.bars .n{color:var(--ink);font-size:13.5px}
.bars .n small{display:block;color:var(--muted);font-size:11.5px}
.track{height:8px;border-radius:4px;background:var(--pale2);overflow:hidden}
.fill{height:100%;border-radius:4px;background:var(--blue)}
.bars .r{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.bars .r small{display:block;color:var(--muted);font-size:11.5px}
@media (max-width:640px){.bars .row{grid-template-columns:1fr 90px;row-gap:8px}.track{grid-column:1/-1;order:3}}
.mixbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px 24px;margin-top:22px}
.legend div{font-size:13px;color:var(--ink);display:flex;gap:10px;align-items:baseline}
.legend i{width:10px;height:10px;border-radius:3px;flex:none;transform:translateY(1px)}
.legend span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
@media (max-width:800px){.two{grid-template-columns:1fr;gap:48px}}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;border-radius:20px;padding:3px 10px;background:var(--pale);color:var(--blue)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--good)}
.btn{border:0;border-radius:24px;padding:11px 22px;font-size:13.5px;font-weight:500;background:var(--blue);color:#fff}
.btn.ghost{background:var(--pale);color:var(--blue)}
.btn:disabled{opacity:.4;cursor:default}

/* guide */
.guide{display:flex;gap:28px;margin-top:36px;flex-wrap:wrap}
.guide a{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--text)}
.guide .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11.5px;color:var(--muted);flex:none}
.guide .done .n{background:var(--teal);border-color:var(--teal);color:#fff}
.guide a:hover{color:var(--blue)}

/* reports */
.rlist .li{grid-template-columns:44px 1fr auto 20px}
@media (max-width:560px){.rlist .li{grid-template-columns:44px 1fr 16px}.rlist .li .stt{display:none}}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--pale);color:var(--blue)}
.ico.xls{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.work{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:start;margin-top:44px}
@media (max-width:900px){.work{grid-template-columns:1fr;gap:36px}}
.doc{background:#fff;color:#22313a;border:1px solid var(--line);border-radius:12px;padding:28px;max-height:560px;overflow:auto;font-size:12px;line-height:1.55;box-shadow:0 10px 30px rgba(22,37,45,.06)}
.doc .dh{display:flex;justify-content:space-between;gap:12px;border-bottom:1.5px solid #22313a;padding-bottom:10px;margin-bottom:14px}
.doc .dh b{font-size:14px}
.doc table{width:100%;border-collapse:collapse;margin-top:8px}
.doc td,.doc th{padding:6px;border-bottom:1px solid #e6ebed;text-align:left;font-size:11.5px}
.doc th{background:#f4f7f8;font-weight:600}
.doc .r{text-align:right;font-variant-numeric:tabular-nums}
.sheet table{border:1px solid #d3dbde}
.sheet th.cl,.sheet td.rn{background:#eef2f3;color:#75858c;text-align:center;font-weight:400;width:28px}
.sheet td{border-right:1px solid #e6ebed}
.fx{border-radius:3px;transition:background .25s,box-shadow .25s}
.fx.hit{background:#CFEFF3;box-shadow:0 0 0 2px #2DBAC3}
.fx.miss{background:#F8E6C8;box-shadow:0 0 0 2px #C9832B}
.fx.done{background:#EAF6F8}
.exl{max-height:300px;overflow:auto;border-top:1px solid var(--line)}
.ex{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:11px 0;border-bottom:1px solid var(--line);animation:fade .3s ease}
.ex .k{font-size:13px;color:var(--ink)}
.ex .v{font-size:13px;color:var(--ink);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.ex .s{font-size:11px;color:var(--muted);grid-column:1/-1}
.ex.flag .v{color:var(--warn)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:13px;color:var(--ink)}
.chk i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;font-style:normal;font-size:11px;background:var(--pale2);color:var(--muted);margin-top:1px}
.chk.ok i{background:var(--good);color:#fff}.chk.warn i{background:var(--warn);color:#fff}
.chk small{display:block;color:var(--muted);font-size:12px}
.issue{background:var(--warnbg);border-radius:14px;padding:18px;margin-top:16px;font-size:13px;color:var(--ink)}
.issue input{font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;width:110px;background:var(--card);color:var(--ink)}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.stats div{font-size:12px;color:var(--muted)}
.stats b{display:block;font-weight:600;letter-spacing:-.02em;font-size:24px;color:var(--ink);font-weight:500}
.ready{padding:48px 0;text-align:left}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;font-weight:400;color:var(--muted);text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:16px 12px 16px 0;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{color:var(--blue)}
.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.up{color:var(--good)}.tbl td.down{color:var(--bad)}
.scroll{overflow-x:auto}

.lin{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.lin i{font-style:normal;color:var(--teal);font-size:10px;margin-top:5px}
.lin small{display:block;color:var(--muted);font-size:12px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:24px;font-size:13px;opacity:0;transition:.3s;z-index:50;max-width:92vw;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--line);padding:28px 0;font-size:11.5px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer img{height:14px;vertical-align:middle;margin-left:6px}
</style>
</head>

<script>
/* ---------- theme ---------- */
(function(){let t=null;try{t=localStorage.getItem('mi-theme')}catch(e){}if(t)document.documentElement.dataset.theme=t;
 document.getElementById('themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('mi-theme',n)}catch(e){};route();};})();

/* ---------- sample data ---------- */
let seed=42;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const MONTHS=[];{const ns=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],nl=['January','February','March','April','May','June','July','August','September','October','November','December'];let y=2024,m=8;for(let i=0;i<24;i++){MONTHS.push({s:ns[m]+' '+String(y).slice(2),l:nl[m]+' '+y});m++;if(m>11){m=0;y++}}}
const LAST=23,PREV=22;
const RMS=[['Ananya Kulkarni',.22],['Rohan Mehta',.20],['Kavita Joshi',.17],['Sameer Patil',.16],['Neha Deshmukh',.14],['Arjun Rao',.11]];
const ASSETS=['Equity MF','Hybrid MF','Debt MF','PMS & AIF','Bonds & FDs'];
const MIX0=[.46,.14,.20,.12,.08];
const AMCS=['HDFC MF','ICICI Prudential MF','SBI MF','Nippon India MF','Axis MF','Kotak MF','Others'];
const AMCW=[.21,.19,.16,.12,.1,.09,.13];
const aum=[],flow=[],sip=[],cli=[],brok=[];let tot=880;
for(let t=0;t<24;t++){const g=0.012+(rnd()-.35)*0.02;tot*=1+g;
  const mix=MIX0.map((v,i)=>i===0?v+t*0.0018:i===2?v-t*0.0012:v-(i===4?t*0.0006:0));const ms=mix.reduce((a,b)=>a+b,0);
  aum[t]=[];flow[t]=[];sip[t]=[];cli[t]=[];
  RMS.forEach(([n,sh],r)=>{const rs=sh*(1+(r===1?t*0.004:r===5?-t*0.002:0)+(rnd()-.5)*0.02);
    aum[t][r]=mix.map(x=>+(tot*rs*x/ms).toFixed(2));
    flow[t][r]=+((tot*rs)*(0.004+rnd()*0.009)*(rnd()<.12?-0.6:1)).toFixed(2);
    sip[t][r]=+((tot*rs)*0.0034*(1+t*0.006)).toFixed(2);
    cli[t][r]=Math.round(sh*1850*(1+t*0.008)+rnd()*6);});
  brok[t]=AMCW.map(w=>+(tot*0.0048/12*100*w*(0.95+rnd()*0.1)).toFixed(2));}
const CLIENTS=[['Deshpande Family Office',0,.105],['Sharma Holdings',1,.092],['Iyer & Sons HUF',2,.088],['Bhatt Family Trust',3,.083],['Gokhale Investments',0,.071],['Menon Family',4,.079],['Kapoor Enterprises',1,.064],['Rane Family Trust',5,.098],['Agarwal Group',2,.061],['Nair Family Office',3,.058],['Patwardhan HUF',4,.052],['Chitale Family',0,.049]];
const CMIX=CLIENTS.map(()=>{const a=MIX0.map(v=>v*(0.6+rnd()*0.8));const s=a.reduce((x,y)=>x+y,0);return a.map(v=>v/s)});

/* ---------- helpers ---------- */
const P={aum:false,brok:false,mis:false};let reviewedOne=false;
const sum=a=>a.reduce((x,y)=>x+y,0);
const rmAum=(t,r)=>sum(aum[t][r]);const totAum=t=>sum(aum[t].map(sum));
const cliAum=(i,t)=>CLIENTS[i][2]*rmAum(t,CLIENTS[i][1])*0.42;
const cr=v=>(v<0?'−':'')+'₹'+Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1})+' Cr';
const lk=v=>(v<0?'−':'')+'₹'+Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:1,maximumFractionDigits:1})+' L';
const pct=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(1)+'%';
const dcls=v=>v>=0?'up':'down';
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const L=src=>P[src]?LAST:PREV;
const SRC={aum:'RTA AUM summary',mis:'RM monthly MIS',brok:'brokerage statement'};
const pend=src=>P[src]?'':`<div class="pend">August arrives with the ${SRC[src]}</div>`;
const COLS=()=>[css('--blue'),css('--teal'),css('--aqua'),css('--c4'),css('--c5')];
let per=12;

/* ---------- charts ---------- */
const charts={};
function kill(){Object.values(charts).forEach(c=>c.destroy());for(const k in charts)delete charts[k]}
function opts(){const m=css('--muted');return{responsive:true,maintainAspectRatio:false,animation:{duration:600},
  plugins:{legend:{display:false},tooltip:{backgroundColor:css('--ink'),titleColor:css('--bg'),bodyColor:css('--bg'),padding:10,cornerRadius:8,displayColors:false,titleFont:{family:'-apple-system, BlinkMacSystemFont, Inter, sans-serif'},bodyFont:{family:'-apple-system, BlinkMacSystemFont, Inter, sans-serif'}}},
  scales:{x:{grid:{display:false},border:{display:false},ticks:{color:m,font:{family:'-apple-system, BlinkMacSystemFont, Inter, sans-serif',size:11},maxRotation:0,autoSkipPadding:18}},
          y:{grid:{color:css('--line'),drawTicks:false},border:{display:false},ticks:{color:m,font:{family:'-apple-system, BlinkMacSystemFont, Inter, sans-serif',size:11},padding:10,maxTicksLimit:5}}}}}
function line(id,labels,data,fmt){if(typeof Chart==='undefined')return;const o=opts();o.plugins.tooltip.callbacks={label:c=>fmt(c.raw)};
  const ctx=$(id).getContext('2d');const g=ctx.createLinearGradient(0,0,0,$(id).parentElement.clientHeight);g.addColorStop(0,css('--blue')+'33');g.addColorStop(1,css('--blue')+'00');
  charts[id]=new Chart(ctx,{type:'line',data:{labels,datasets:[{data,borderColor:css('--blue'),backgroundColor:g,fill:true,tension:.35,borderWidth:2,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:css('--blue')}]},options:o})}
function bars(id,labels,data,fmt){if(typeof Chart==='undefined')return;const o=opts();o.plugins.tooltip.callbacks={label:c=>fmt(c.raw)};
  charts[id]=new Chart($(id),{type:'bar',data:{labels,datasets:[{data,backgroundColor:data.map((v,i)=>v<0?css('--bad'):i===data.length-1?css('--blue'):css('--aqua')),borderRadius:4,maxBarThickness:26}]},options:o})}
const range=last=>[...Array(per)].map((_,i)=>last-per+1+i).filter(i=>i>=0);
const segHtml=()=>`<div class="seg"><button data-p="12" class="${per===12?'on':''}">12 months</button><button data-p="24" class="${per===24?'on':''}">24 months</button></div>`;
function bindSeg(){document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{per=+b.dataset.p;route()})}

/* ---------- pages ---------- */

function statusLine(){const n=Object.values(P).filter(v=>!v).length;

          :`<div class="status ok"><span class="d"></span><span>August 2026 is in. 3 reports read and checked automatically, ${reviewedOne?'1 item confirmed by your team, ':''}0 figures typed by hand.</span><a href="#/aum">Explore the numbers</a></div>`}

    <div class="list rlist">${Object.entries(REPORTS).map(([k,r])=>`<a class="li" href="#/reports/${k}"><span class="ico ${r.type}">${r.type==='pdf'?'PDF':'XLS'}</span><div><div class="t">${r.name}</div><div class="s">${r.file}<br>${r.from}</div></div><div class="stt">${P[k]?'<span class="pill good">Loaded</span>':'<span class="pill warn">New</span>'}</div><span class="chev">›</span></a>`).join('')}</div>
   </div></section>`}
function aReports(){const b=$('all');if(b)b.onclick=async()=>{for(const k of Object.keys(P)){if(P[k])continue;location.hash='#/reports/'+k;await sleep(120);const ok=await run(k,true);if(!ok)return;await sleep(500)}}}

function pReport(k){const r=REPORTS[k];
  return `<section class="page">${crumb([['Reports','#/reports'],[r.name]])}
   <h1>${r.name}</h1><p class="intro">${r.file}. Feeds: ${r.feeds}.</p>
   <div class="work"><div><div class="meta" style="margin-bottom:12px">Original file, as received</div><div class="doc" id="doc">${r.doc()}</div></div>
   <div id="exPanel"></div></div></section>`}
function aReport(k){const r=REPORTS[k];
  if(P[k]){doneView(k,false);document.querySelectorAll('#doc .fx').forEach(e=>e.classList.add('done'));return}
  $('exPanel').innerHTML=`<div class="ready"><h2>Ready to process</h2><p class="meta" style="margin:6px 0 24px">${r.fields().length} figures will be read from this ${r.type==='pdf'?'PDF':'Excel file'}, then checked.</p><button class="btn" id="run">Extract data</button></div>`;
  $('run').onclick=()=>run(k)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(k,fast){if(running)return;running=true;const my=++runId;const r=REPORTS[k];const t0=performance.now();
  const pan=$('exPanel');pan.innerHTML=`<div class="sh" style="margin-bottom:12px"><h2 id="exH">Reading figures…</h2><span id="exT" class="pill">Extracting</span></div><div class="exl" id="exl"></div><div id="chk" style="margin-top:18px"></div>`;
  const doc=$('doc');const fl=r.fields();
  for(const [key,label,val,loc,miss] of fl){if(my!==runId)return false;const el=doc.querySelector(`[data-k="${key}"]`);
    if(el){el.classList.add(miss?'miss':'hit');doc.scrollTo({top:el.offsetTop-doc.clientHeight/2,behavior:'smooth'})}
    $('exl').insertAdjacentHTML('beforeend',`<div class="ex ${miss?'flag':''}"><span class="k">${label}</span><span class="v">${val}</span><span class="s">Source: ${loc}</span></div>`);$('exl').scrollTop=$('exl').scrollHeight;
    await sleep(fast?60:220);if(el){el.classList.remove('hit');if(!miss)el.classList.add('done')}}
  if(my!==runId||!$('exH')){return false}
  $('exH').textContent='Checking…';$('exT').textContent='Checking';
  for(const [s,t,d] of r.checks()){if(my!==runId)return false;$('chk').insertAdjacentHTML('beforeend',`<div class="chk ${s}"><i>${s==='ok'?'✓':'!'}</i><div>${t}<small>${d}</small></div></div>`);await sleep(fast?110:380)}
  lastRun[k]=((performance.now()-t0)/1000).toFixed(1);
  if(r.checks().some(c=>c[0]==='warn')){
    const others=sum(flow[LAST].filter((_,i)=>i!==MISS)),tot=sum(flow[LAST].map((v,i)=>i===MISS?origFlow:v));
    $('exH').textContent='1 item needs review';$('exT').className='pill warn';$('exT').textContent='Review';
    $('chk').insertAdjacentHTML('beforeend',`<div class="issue"><b>Held back, not loaded.</b> The net inflow for ${RMS[MISS][0]} is blank. The file’s total row shows ${cr(tot)}; the other RMs add up to ${cr(others)}, which suggests the value below.
      <div style="display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap">₹ <input id="fixV" value="${(tot-others).toFixed(2)}" inputmode="decimal"> Cr <button class="btn" id="fixB">Confirm and load</button></div></div>`);
    $('fixB').onclick=()=>{const v=parseFloat($('fixV').value);if(!isNaN(v))flow[LAST][MISS]=v;fixed=true;reviewedOne=true;const el=doc.querySelector(`[data-k="rf${MISS}"]`);if(el){el.classList.remove('miss');el.classList.add('done');el.textContent=f2(v)}const is=document.querySelector('.issue');if(is)is.outerHTML=`<div class="chk ok"><i>✓</i><div>Confirmed by your team<small>${RMS[MISS][0]}: net inflow ${cr(v)}, recorded with your name and time</small></div></div>`;publish(k)};
    running=false;return false}
  publish(k);running=false;return true}
function publish(k){P[k]=true;navDot();toast(`${REPORTS[k].name} loaded. Dashboard updated for August 2026.`);doneView(k,true)}
function doneView(k,fresh){const r=REPORTS[k];const next=Object.keys(P).find(x=>!P[x]);
  const html=`<div class="stats"><div><b>${r.fields().length}</b>figures read</div><div><b>${lastRun[k]?lastRun[k]+' s':'Seconds'}</b>processing</div><div><b>0</b>typed by hand</div><div><b>${k==='mis'&&reviewedOne?1:0}</b>confirmed by a person</div></div>
   <div style="display:flex;gap:10px;margin-top:26px;flex-wrap:wrap"><a class="btn" href="#/${k==='brok'?'brokerage':k==='mis'?'rms':'aum'}">See it in the dashboard</a>${next?`<a class="btn ghost" href="#/reports/${next}">Next report</a>`:''}</div>`;
  if(fresh&&$('chk')){$('exH').textContent='Checked and loaded';$('exT').className='pill good';$('exT').textContent='Loaded';$('chk').insertAdjacentHTML('beforeend',html)}
  else $('exPanel').innerHTML=`<div class="sh" style="margin-bottom:8px"><h2>Checked and loaded</h2><span class="pill good">Loaded</span></div><div class="chk ok"><i>✓</i><div>All checks passed<small>These figures are in the database and on the dashboard.</small></div></div>`+html}

/* ---------- history ---------- */
const FILES=[['AUM_Tracker_FY2024-25.xlsx',7,'8,412','41 duplicates merged, 118 dates standardised'],['AUM_Tracker_FY2025-26.xlsx',12,'14,960','63 duplicates merged, 22 blank rows removed'],['Client_Master_2025.xlsx',1,'1,904','Names matched across files, 37 PAN formats fixed'],['RM_Performance_Mar2026.xlsx',3,'2,211','RM names mapped to one master list'],['Brokerage_Register_FY26.xlsx',12,'3,486','Fund house names standardised'],['SIP_Book_Q1FY27.xlsx',3,'5,127','All amounts converted to one unit']];
function pHistory(){const d=Object.values(P).filter(Boolean).length;
  return `<section class="page"><h1>Data history</h1><p class="intro">Before the first report is processed, years of Excel files are cleaned and moved into one database.</p>
   <div class="kpis"><div class="kpi"><div class="kl">Excel files migrated</div><div class="kv">6</div></div><div class="kpi"><div class="kl">Records loaded</div><div class="kv">36,100</div></div><div class="kpi"><div class="kl">Duplicates merged</div><div class="kv">104</div></div><div class="kpi"><div class="kl">Months of history</div><div class="kv">24</div></div></div>
   <div class="section"><div class="sh"><div><h2>Migrated files</h2><div class="meta">What was found and fixed in each</div></div></div>
    <div class="scroll"><table class="tbl"><tr><th>File</th><th class="num">Records</th><th>Cleaned during migration</th></tr>${FILES.map(f=>`<tr><td>${f[0]}<div class="meta">${f[1]} sheet${f[1]>1?'s':''}</div></td><td class="num">${f[2]}</td><td style="color:var(--text)">${f[3]}</td></tr>`).join('')}</table></div></div>
   <div class="section"><div class="sh"><div><h2>How each month arrived</h2><div class="meta">Every month is traceable to its source</div></div></div>
    <div class="list">${[[MONTHS[LAST].l,d===3?'Automated, 3 reports':d?`Automated, ${d} of 3 reports`:'Waiting for reports',d===3?'good':'warn'],[MONTHS[PREV].l,'Automated, 3 reports','good'],['Sep 2024 to Jun 2026','Migrated from Excel','']].map(([a,b,c])=>`<div class="li" style="grid-template-columns:1fr auto"><div class="t">${a}</div><span class="pill ${c}">${b}</span></div>`).join('')}</div></div>
  </section>`}

/* ---------- router ---------- */
const visited={aum:false};
function navDot(){$('navDot').style.display=Object.values(P).every(Boolean)?'none':'block'}
function route(){if(running)return;kill();const h=location.hash.replace(/^#\/?/,'');const [a,b]=h.split('/');let html,after;
  const R={'':[pOverview,aOverview],aum:[pAum,aAum],flows:[pFlows,aFlows],rms:[b!==undefined?()=>pRm(+b):pRms,b!==undefined?()=>aRm(+b):null],clients:[b!==undefined?()=>pClient(+b):pClients,b!==undefined?()=>aClient(+b):null],brokerage:[pBrok,aBrok],reports:[b?()=>pReport(b):pReports,b?()=>aReport(b):aReports],history:[pHistory,null]};
  const e=R[a]||R[''];$('app').innerHTML=e[0]();if(e[1])e[1]();
  document.querySelectorAll('#nav a').forEach(n=>n.classList.toggle('on',n.dataset.n===(['aum','flows','rms','clients','brokerage'].includes(a)?'':(a||''))));
  window.scrollTo(0,0);navDot()}
window.addEventListener('hashchange',()=>{runId++;running=false;route()});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3000)}
route();
</script>
